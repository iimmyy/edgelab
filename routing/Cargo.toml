[package]
name = "edgelab-routing"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
axum = "0.8"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
tracing-appender = "=0.2.5"
